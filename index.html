function ExportSales({ salesLog, period }) {
  const exportCSV = () => {
    const rows = [["Date", "Time", "Item", "Qty", "Unit", "Price Per Unit (R)", "Total (R)", "Note"]];
    salesLog.forEach(s => {
      const d = new Date(s.created_at);
      rows.push([
        d.toLocaleDateString("en-ZA"),
        d.toLocaleTimeString("en-ZA", { hour: "2-digit", minute: "2-digit" }),
        s.item_name, s.qty, s.unit,
        Number(s.price_per_unit).toFixed(2),
        Number(s.total).toFixed(2),
        s.note || ""
      ]);
    });
    // Summary rows
    const total = salesLog.reduce((s, x) => s + (x.total || 0), 0);
    rows.push([]);
    rows.push(["TOTAL", "", "", "", "", "", Number(total).toFixed(2), ""]);
    rows.push(["Report generated", new Date().toLocaleString("en-ZA"), "", "", "", "", "", ""]);

    const csv = rows.map(r => r.map(v => `"${v}"`).join(",")).join("
");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `elegant-parfums-sales-${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
  };

  const exportText = () => {
    const total = salesLog.reduce((s, x) => s + (x.total || 0), 0);
    const txCount = salesLog.length;
    const topItem = Object.values(salesLog.reduce((acc, s) => {
      if (!acc[s.item_name]) acc[s.item_name] = { name: s.item_name, total: 0 };
      acc[s.item_name].total += s.total || 0;
      return acc;
    }, {})).sort((a, b) => b.total - a.total)[0];

    const lines = [
      "═══════════════════════════════",
      "   ELEGANT PARFUMS",
      "   Sales Report",
      `   Generated: ${new Date().toLocaleDateString("en-ZA")}`,
      "═══════════════════════════════",
      "",
      `Total Revenue:    R${total.toLocaleString("en-ZA", { minimumFractionDigits: 2 })}`,
      `Total Sales:      ${txCount} transactions`,
      topItem ? `Top Item:         ${topItem.name}` : "",
      "",
      "───────────────────────────────",
      "SALES DETAIL",
      "───────────────────────────────",
      ...salesLog.map(s => {
        const d = new Date(s.created_at);
        return `${d.toLocaleDateString("en-ZA")}  ${s.item_name}
  ${s.qty} × R${Number(s.price_per_unit).toFixed(2)} = R${Number(s.total).toFixed(2)}${s.note ? `
  Note: ${s.note}` : ""}`;
      }),
      "",
      "═══════════════════════════════",
    ].join("
");

    const blob = new Blob([lines], { type: "text/plain;charset=utf-8;" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `elegant-parfums-sales-${new Date().toISOString().slice(0,10)}.txt`;
    a.click();
  };

  return (
    <div style={{ marginTop: 28, background: "rgba(201,169,110,0.04)", border: "1px solid rgba(201,169,110,0.12)", padding: "18px 16px" }}>
      <div style={{ fontSize: 10, color: "#c9a96e", letterSpacing: 2, textTransform: "uppercase", marginBottom: 6 }}>Download Sales Report</div>
      <p style={{ fontSize: 11, color: "#555", marginBottom: 16, lineHeight: 1.6 }}>{salesLog.length} sales records available to export.</p>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
        <button onClick={exportCSV} style={{ background: "#c9a96e", color: "#0a0a0a", border: "none", padding: "12px", fontSize: 11, fontWeight: 700, cursor: "pointer", letterSpacing: 1, fontFamily: "'DM Mono', monospace", textTransform: "uppercase" }}>
          ↓ CSV / Excel
        </button>
        <button onClick={exportText} style={{ background: "transparent", border: "1px solid rgba(201,169,110,0.3)", color: "#c9a96e", padding: "12px", fontSize: 11, cursor: "pointer", letterSpacing: 1, fontFamily: "'DM Mono', monospace", textTransform: "uppercase" }}>
          ↓ Text Report
        </button>
      </div>
    </div>
  );
}

              This will permanently delete <strong style={{ color: "#f0ede6" }}>all {salesLog.length} sales records</strong>. Revenue, profit and analytics data will be cleared.

function AnalyticsTab({ salesLog, inventory }) {
  const [period, setPeriod] = useState("weekly");

  const now = new Date();

  // ── helpers ──
  const startOf = (d) => { const x = new Date(d); x.setHours(0,0,0,0); return x; };
  const weekStart = (d) => { const x = startOf(d); x.setDate(x.getDate() - x.getDay()); return x; };
  const monthStart = (d) => { const x = startOf(d); x.setDate(1); return x; };

  // ── build weekly buckets (last 8 weeks) ──
  const weeklyData = Array.from({ length: 8 }, (_, i) => {
    const end = new Date(weekStart(now)); end.setDate(end.getDate() - i * 7);
    const start = new Date(end); start.setDate(start.getDate() - 7);
    const sales = salesLog.filter(s => { const d = new Date(s.created_at); return d >= start && d < end; });
    const revenue = sales.reduce((s, x) => s + (x.total || 0), 0);
    const cost = sales.reduce((s, x) => {
      const item = inventory.find(it => it.id === x.item_id);
      return s + (item ? item.cost_price * x.qty : 0);
    }, 0);
    const label = `${start.getDate()}/${start.getMonth()+1}`;
    return { label, revenue, cost, profit: revenue - cost, transactions: sales.length };
  }).reverse();

  // ── build monthly buckets (last 6 months) ──
  const monthlyData = Array.from({ length: 6 }, (_, i) => {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const start = monthStart(d);
    const end = new Date(d.getFullYear(), d.getMonth() + 1, 1);
    const sales = salesLog.filter(s => { const dt = new Date(s.created_at); return dt >= start && dt < end; });
    const revenue = sales.reduce((s, x) => s + (x.total || 0), 0);
    const cost = sales.reduce((s, x) => {
      const item = inventory.find(it => it.id === x.item_id);
      return s + (item ? item.cost_price * x.qty : 0);
    }, 0);
    const label = d.toLocaleString("en-ZA", { month: "short" });
    return { label, revenue, cost, profit: revenue - cost, transactions: sales.length };
  }).reverse();

  const data = period === "weekly" ? weeklyData : monthlyData;
  const current = data[data.length - 1] || {};
  const previous = data[data.length - 2] || {};
  const totalRevenue = data.reduce((s, d) => s + d.revenue, 0);
  const totalProfit = data.reduce((s, d) => s + d.profit, 0);
  const totalTx = data.reduce((s, d) => s + d.transactions, 0);
  const avgRevenue = totalRevenue / (data.filter(d => d.revenue > 0).length || 1);

  // ── projection: simple linear trend ──
  const revenuePoints = data.map(d => d.revenue);
  const n = revenuePoints.length;
  const sumX = n * (n - 1) / 2;
  const sumY = revenuePoints.reduce((a, b) => a + b, 0);
  const sumXY = revenuePoints.reduce((s, y, i) => s + i * y, 0);
  const sumX2 = revenuePoints.reduce((s, _, i) => s + i * i, 0);
  const slope = (n * sumXY - sumX * sumY) / (n * sumX2 - sumX * sumX) || 0;
  const intercept = (sumY - slope * sumX) / n;
  const projected = Math.max(0, slope * n + intercept);
  const trend = slope >= 0 ? "up" : "down";

  const maxVal = Math.max(...data.map(d => d.revenue), 1);
  const formatZAR = (v) => v == null ? "—" : `R${Number(v).toLocaleString("en-ZA", { minimumFractionDigits: 0 })}`;

  // ── top selling items ──
  const itemMap = {};
  salesLog.forEach(s => {
    if (!itemMap[s.item_name]) itemMap[s.item_name] = { name: s.item_name, qty: 0, revenue: 0 };
    itemMap[s.item_name].qty += s.qty;
    itemMap[s.item_name].revenue += s.total || 0;
  });
  const topItems = Object.values(itemMap).sort((a, b) => b.revenue - a.revenue).slice(0, 5);

  return (
    <div className="page" style={{ padding: "20px 16px 80px" }}>

      {/* Period Toggle */}
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", border: "1px solid rgba(255,255,255,0.1)", marginBottom: 24 }}>
        {[["weekly", "Weekly"], ["monthly", "Monthly"]].map(([val, lbl]) => (
          <button key={val} onClick={() => setPeriod(val)} style={{ padding: "12px", background: period === val ? "#c9a96e" : "transparent", color: period === val ? "#0a0a0a" : "#666", border: "none", fontSize: 12, fontWeight: period === val ? 700 : 400, cursor: "pointer", fontFamily: "'DM Mono', monospace", letterSpacing: 1 }}>{lbl}</button>
        ))}
      </div>

      {/* Summary Cards */}
      <div className="grid2" style={{ marginBottom: 20 }}>
        {[
          { label: `This ${period === "weekly" ? "Week" : "Month"}`, value: formatZAR(current.revenue), sub: `${current.transactions || 0} sales` },
          { label: "Profit", value: formatZAR(current.profit), sub: current.revenue > 0 ? `${Math.round((current.profit / current.revenue) * 100)}% margin` : "—", accent: (current.profit || 0) > 0 },
          { label: `${period === "weekly" ? "8-Week" : "6-Month"} Revenue`, value: formatZAR(totalRevenue), sub: `${totalTx} total sales` },
          { label: "Next Period Projection", value: formatZAR(projected), sub: trend === "up" ? "📈 Trending up" : "📉 Trending down", accent: trend === "up" },
        ].map(s => (
          <div key={s.label} style={{ background: "rgba(255,255,255,0.03)", border: `1px solid ${s.accent ? "rgba(0,229,160,0.25)" : "rgba(255,255,255,0.07)"}`, padding: "16px 14px", marginBottom: 0 }}>
            <div style={{ fontSize: 18, fontWeight: 700, fontFamily: "'Playfair Display', serif", color: s.accent ? "#00e5a0" : "#f0ede6", marginBottom: 4 }}>{s.value}</div>
            <div style={{ fontSize: 9, color: "#555", letterSpacing: 2, textTransform: "uppercase" }}>{s.label}</div>
            <div style={{ fontSize: 10, color: s.accent ? "#00e5a0" : "#444", marginTop: 4 }}>{s.sub}</div>
          </div>
        ))}
      </div>

      {/* Bar Chart */}
      <div style={{ fontSize: 10, color: "#555", letterSpacing: 3, textTransform: "uppercase", marginBottom: 14 }}>Revenue Chart</div>
      <div style={{ background: "rgba(255,255,255,0.02)", border: "1px solid rgba(255,255,255,0.06)", padding: "16px 12px 8px", marginBottom: 24 }}>
        <div style={{ display: "flex", alignItems: "flex-end", gap: 4, height: 120, marginBottom: 8 }}>
          {data.map((d, i) => {
            const h = Math.max(4, (d.revenue / maxVal) * 100);
            const ph = Math.max(0, (d.profit / maxVal) * 100);
            const isLast = i === data.length - 1;
            return (
              <div key={i} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "flex-end", height: "100%" }}>
                <div style={{ width: "100%", position: "relative", display: "flex", flexDirection: "column", justifyContent: "flex-end", height: `${h}%` }}>
                  <div style={{ width: "100%", height: "100%", background: isLast ? "#c9a96e" : "rgba(201,169,110,0.3)", position: "relative" }}>
                    <div style={{ position: "absolute", bottom: 0, width: "100%", height: `${ph > 0 ? (ph / h) * 100 : 0}%`, background: isLast ? "rgba(0,229,160,0.5)" : "rgba(0,229,160,0.2)" }} />
                  </div>
                </div>
              </div>
            );
          })}
        </div>
        <div style={{ display: "flex", gap: 4 }}>
          {data.map((d, i) => (
            <div key={i} style={{ flex: 1, textAlign: "center", fontSize: 8, color: i === data.length - 1 ? "#c9a96e" : "#444" }}>{d.label}</div>
          ))}
        </div>
        <div style={{ display: "flex", gap: 16, marginTop: 10, justifyContent: "center" }}>
          <span style={{ fontSize: 9, color: "#c9a96e", letterSpacing: 1 }}>▪ Revenue</span>
          <span style={{ fontSize: 9, color: "#00e5a0", letterSpacing: 1 }}>▪ Profit</span>
        </div>
      </div>

      {/* Period Breakdown */}
      <div style={{ fontSize: 10, color: "#555", letterSpacing: 3, textTransform: "uppercase", marginBottom: 14 }}>Period Breakdown</div>
      {[...data].reverse().slice(0, 5).map((d, i) => (
        <div key={i} style={{ display: "flex", alignItems: "center", padding: "10px 0", borderBottom: "1px solid rgba(255,255,255,0.04)" }}>
          <div style={{ width: 48, fontSize: 10, color: "#666" }}>{d.label}</div>
          <div style={{ flex: 1, marginLeft: 12 }}>
            <div style={{ height: 4, background: "rgba(255,255,255,0.05)", borderRadius: 2, overflow: "hidden" }}>
              <div style={{ height: "100%", width: `${(d.revenue / maxVal) * 100}%`, background: "#c9a96e", borderRadius: 2 }} />
            </div>
          </div>
          <div style={{ textAlign: "right", marginLeft: 12, minWidth: 80 }}>
            <div style={{ fontSize: 12, fontWeight: 600, color: "#f0ede6" }}>{formatZAR(d.revenue)}</div>
            <div style={{ fontSize: 10, color: d.profit >= 0 ? "#00e5a0" : "#ff4d4d" }}>{formatZAR(d.profit)} profit</div>
          </div>
        </div>
      ))}

      {/* Top Sellers */}
      {topItems.length > 0 && (
        <>
          <div style={{ fontSize: 10, color: "#555", letterSpacing: 3, textTransform: "uppercase", marginBottom: 14, marginTop: 28 }}>Top Selling Items</div>
          {topItems.map((item, i) => (
            <div key={i} style={{ display: "flex", alignItems: "center", padding: "10px 0", borderBottom: "1px solid rgba(255,255,255,0.04)" }}>
              <div style={{ fontSize: 13, color: "#c9a96e", fontWeight: 700, width: 20 }}>{i + 1}</div>
              <div style={{ flex: 1, marginLeft: 8 }}>
                <div style={{ fontSize: 13, color: "#f0ede6" }}>{item.name}</div>
                <div style={{ fontSize: 10, color: "#555" }}>{item.qty} unit(s) sold</div>
              </div>
              <div style={{ fontSize: 13, fontWeight: 600, color: "#00e5a0" }}>{formatZAR(item.revenue)}</div>
            </div>
          ))}
        </>
      )}

      {salesLog.length === 0 && (
        <div style={{ textAlign: "center", color: "#333", fontSize: 12, padding: "40px 0" }}>No sales data yet. Record some sales to see analytics.</div>
      )}

      {/* Export Sales Report */}
      {salesLog.length > 0 && (
        <ExportSales salesLog={salesLog} period={period} />
      )}

      {/* Reset Sales */}
      {salesLog.length > 0 && (
        <ResetSales salesLog={salesLog} onReset={async () => {
          const ids = salesLog.map(s => s.id);
          await sb.from("sales_log").delete().in("id", ids);
          window.location.reload();
        }} />
      )}

      {/* Avg & Projection note */}
      <div style={{ marginTop: 28, background: "rgba(201,169,110,0.05)", border: "1px solid rgba(201,169,110,0.12)", padding: "16px" }}>
        <div style={{ fontSize: 10, color: "#c9a96e", letterSpacing: 2, textTransform: "uppercase", marginBottom: 10 }}>📈 Projection</div>
        <div style={{ fontSize: 12, color: "#aaa", lineHeight: 1.8 }}>
          Average {period} revenue: <strong style={{ color: "#f0ede6" }}>{formatZAR(avgRevenue)}</strong><br/>
          Next {period === "weekly" ? "week" : "month"} projection: <strong style={{ color: "#c9a96e" }}>{formatZAR(projected)}</strong><br/>
          Trend: <strong style={{ color: trend === "up" ? "#00e5a0" : "#ff4d4d" }}>{trend === "up" ? "📈 Growing" : "📉 Declining"}</strong>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [authed, setAuthed] = useState(() => sessionStorage.getItem(AUTH_KEY) === "1");
  const [tab, setTab] = useState("inventory");
  const [inventory, setInventory] = useState([]);
  const [salesLog, setSalesLog] = useState([]);
  const [loading, setLoading] = useState(true);
  const [filter, setFilter] = useState("All");
  const [search, setSearch] = useState("");
  const [modal, setModal] = useState(null);
  const [form, setForm] = useState(EMPTY_FORM);
  const [adjustQty, setAdjustQty] = useState("");
  const [adjustType, setAdjustType] = useState("remove");
  const [salePrice, setSalePrice] = useState("");
  const [saleNote, setSaleNote] = useState("");
  const [toast, setToast] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(null);

  const showToast = (msg, type = "success") => { setToast({ msg, type }); setTimeout(() => setToast(null), 2800); };

  const fetchInventory = useCallback(async () => {
    const { data } = await sb.from("inventory").select("*").order("created_at", { ascending: true });
    setInventory(data || []);
  }, []);

  const fetchSales = useCallback(async () => {
    const { data } = await sb.from("sales_log").select("*").order("created_at", { ascending: false }).limit(50);
    setSalesLog(data || []);
  }, []);

  useEffect(() => {
    const init = async () => {
      setLoading(true);
      await Promise.all([fetchInventory(), fetchSales()]);
      setLoading(false);
    };
    init();
  }, [fetchInventory, fetchSales]);

  const displayed = inventory.filter(item => {
    const catMatch = filter === "All" || item.category === filter;
    const q = search.toLowerCase();
    return catMatch && (!q || item.name.toLowerCase().includes(q) || item.sku.toLowerCase().includes(q));
  });

  const lowItems = inventory.filter(i => i.quantity <= i.low_stock);
  const outItems = inventory.filter(i => i.quantity === 0);
  const totalCostValue = inventory.reduce((s, i) => s + i.quantity * i.cost_price, 0);
  const totalSellValue = inventory.filter(i => i.selling_price).reduce((s, i) => s + i.quantity * (i.selling_price || 0), 0);
  const totalProfit = totalSellValue - totalCostValue;
  const todaySales = salesLog.filter(s => new Date(s.created_at).toDateString() === new Date().toDateString());
  const todayRevenue = todaySales.reduce((s, i) => s + (i.total || 0), 0);
  const totalRevenue = salesLog.reduce((s, i) => s + (i.total || 0), 0);

  const openAdd = () => { setForm(EMPTY_FORM); setModal({ mode: "add" }); };
  const openEdit = (item) => { setForm({ ...item, cost_price: item.cost_price ?? "", selling_price: item.selling_price ?? "", low_stock: item.low_stock ?? "" }); setModal({ mode: "edit", item }); };
  const openAdjust = (item) => { setAdjustQty(""); setAdjustType("remove"); setSalePrice(item.selling_price || ""); setSaleNote(""); setModal({ mode: "adjust", item }); };
  const closeModal = () => setModal(null);

  const saveItem = async () => {
    if (!form.name.trim() || !form.sku.trim() || form.quantity === "" || form.cost_price === "") {
      showToast("Fill in all required fields.", "error"); return;
    }
    const payload = {
      name: form.name.trim(), sku: form.sku.trim().toUpperCase(), category: form.category, unit: form.unit,
      quantity: Number(form.quantity), low_stock: Number(form.low_stock) || 0,
      cost_price: Number(form.cost_price),
      selling_price: form.selling_price !== "" ? Number(form.selling_price) : null,
      notes: form.notes,
    };
    if (modal.mode === "add") {
      const { error } = await sb.from("inventory").insert(payload);
      if (error) { showToast("Error saving item.", "error"); return; }
      showToast(`"${payload.name}" added. ✓`);
    } else {
      const { error } = await sb.from("inventory").update(payload).eq("id", modal.item.id);
      if (error) { showToast("Error updating item.", "error"); return; }
      showToast(`"${payload.name}" updated. ✓`);
    }
    await fetchInventory();
    closeModal();
  };

  const applyAdjust = async () => {
    const delta = Number(adjustQty);
    if (!delta || isNaN(delta) || delta <= 0) { showToast("Enter a valid quantity.", "error"); return; }
    const item = modal.item;
    const newQty = adjustType === "add" ? item.quantity + delta : Math.max(0, item.quantity - delta);
    const { error } = await sb.from("inventory").update({ quantity: newQty }).eq("id", item.id);
    if (error) { showToast("Error adjusting stock.", "error"); return; }

    // Log sale if removing stock
    if (adjustType === "remove") {
      const priceEach = Number(salePrice) || Number(item.selling_price) || 0;
      const salePayload = {
        item_id: Number(item.id),
        item_name: String(item.name),
        qty: Number(delta),
        unit: String(item.unit),
        price_per_unit: Number(priceEach),
        total: Number(priceEach * delta),
        note: saleNote || "",
      };
      const { error: saleError } = await sb.from("sales_log").insert(salePayload);
      if (saleError) {
        showToast("Stock updated but sale log failed: " + saleError.message, "warn");
      } else {
        await fetchSales();
        showToast(`Sale recorded: ${delta} × ${item.name} ✓`);
      }
    } else {
      showToast(`Added ${delta} ${item.unit}(s) to stock. ✓`);
    }
    await fetchInventory();
    closeModal();
  };

  const doDelete = async (id) => {
    const item = inventory.find(i => i.id === id);
    const { error } = await sb.from("inventory").delete().eq("id", id);
    if (error) { showToast("Error deleting item.", "error"); return; }
    showToast(`"${item.name}" removed.`, "warn");
    await fetchInventory();
    setConfirmDelete(null);
  };

  const exportCSV = () => {
    const rows = [["Name","SKU","Category","Unit","Quantity","Low Stock","Cost Price","Selling Price","Stock Value","Notes"]];
    inventory.forEach(i => rows.push([i.name, i.sku, i.category, i.unit, i.quantity, i.low_stock, i.cost_price, i.selling_price ?? "", (i.quantity * i.cost_price).toFixed(2), i.notes ?? ""]));
    const csv = rows.map(r => r.map(v => `"${v}"`).join(",")).join("\n");
    const blob = new Blob([csv], { type: "text/csv" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "elegant-parfums-inventory.csv"; a.click();
    showToast("Inventory exported. ✓");
  };

  const F = (key) => (e) => setForm(p => ({ ...p, [key]: e.target.value }));

  const tabs = [
    { id: "inventory", icon: "📦", label: "Stock" },
    { id: "sales", icon: "💰", label: "Sales" },
    { id: "analytics", icon: "📈", label: "Analytics" },
    { id: "stats", icon: "📊", label: "Overview" },
    { id: "alerts", icon: "🔔", label: "Alerts" },
  ];

  if (!authed) return <LoginScreen onLogin={() => setAuthed(true)} />;

  return (
    <div style={{ minHeight: "100vh", background: "#0a0a0a", maxWidth: 600, margin: "0 auto", position: "relative" }}>

      {/* HEADER */}
      <header style={{ display: "flex", alignItems: "flex-end", justifyContent: "space-between", padding: "44px 20px 18px", borderBottom: "1px solid rgba(255,255,255,0.07)", background: "#0a0a0a", position: "sticky", top: 0, zIndex: 40 }}>
        <div>
          <div style={{ fontSize: 10, color: "#c9a96e", letterSpacing: 6, marginBottom: 3 }}>✦ INVENTORY</div>
          <h1 style={{ fontFamily: "'Playfair Display', Georgia, serif", fontSize: 24, fontWeight: 700, letterSpacing: 3, color: "#f0ede6", margin: 0 }}>ELEGANT PARFUMS</h1>
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <button onClick={openAdd} style={{ background: "#c9a96e", color: "#0a0a0a", border: "none", padding: "9px 18px", fontSize: 11, fontWeight: 700, letterSpacing: 2, cursor: "pointer", textTransform: "uppercase" }}>+ Add</button>
          <button onClick={() => { sessionStorage.removeItem("ep_auth_v1"); setAuthed(false); }} style={{ background: "transparent", border: "1px solid rgba(255,255,255,0.08)", color: "#555", padding: "9px 12px", fontSize: 11, cursor: "pointer" }} title="Lock">🔒</button>
        </div>
      </header>

      {loading && (
        <div style={{ textAlign: "center", padding: "80px 20px", color: "#444", fontSize: 11, letterSpacing: 3 }}>☁ SYNCING…</div>
      )}

      {/* ── INVENTORY TAB ── */}
      {!loading && tab === "inventory" && (
        <div className="page" style={{ padding: "12px 16px 80px" }}>
          <input value={search} onChange={e => setSearch(e.target.value)} placeholder="🔍  Search name or SKU…" className="input" style={{ marginBottom: 12 }} />
          <div style={{ display: "flex", gap: 8, overflowX: "auto", marginBottom: 16, paddingBottom: 4 }}>
            {CATEGORIES.map(c => (
              <button key={c} onClick={() => setFilter(c)} style={{ background: filter === c ? "rgba(201,169,110,0.1)" : "transparent", border: `1px solid ${filter === c ? "#c9a96e" : "rgba(255,255,255,0.08)"}`, color: filter === c ? "#c9a96e" : "#555", padding: "6px 14px", fontSize: 10, letterSpacing: 1.5, textTransform: "uppercase", cursor: "pointer", whiteSpace: "nowrap", flexShrink: 0, fontFamily: "'DM Mono', monospace" }}>{c}</button>
            ))}
          </div>

          {/* low stock banner */}
          {lowItems.length > 0 && (
            <div style={{ background: "rgba(255,170,0,0.08)", border: "1px solid rgba(255,170,0,0.2)", color: "#ffaa00", fontSize: 11, padding: "10px 14px", marginBottom: 16, lineHeight: 1.6 }}>
              ⚠ {lowItems.length} item{lowItems.length > 1 ? "s" : ""} low on stock
            </div>
          )}

          {displayed.length === 0 && <div style={{ textAlign: "center", color: "#333", padding: "60px 0", fontSize: 12 }}>No items found.</div>}

          {displayed.map(item => (
            <div key={item.id} className="card">
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 8 }}>
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 15, fontWeight: 600, color: "#f0ede6", marginBottom: 2 }}>{item.name}</div>
                  <div style={{ fontSize: 10, color: "#555", letterSpacing: 1 }}>{item.sku}</div>
                </div>
                <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", gap: 4 }}>
                  <span className="badge" style={{ background: catColor(item.category) }}>{item.category}</span>
                  <span style={{ fontSize: 9, fontWeight: 700, letterSpacing: 1.5, color: stockColor(item), border: `1px solid ${stockColor(item)}`, padding: "2px 6px" }}>{stockLabel(item)}</span>
                </div>
              </div>
              {item.notes && <div style={{ fontSize: 11, color: "#555", marginBottom: 10, lineHeight: 1.5 }}>{item.notes}</div>}
              <div style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 4, borderTop: "1px solid rgba(255,255,255,0.05)", borderBottom: "1px solid rgba(255,255,255,0.05)", padding: "10px 0", margin: "10px 0" }}>
                {[
                  { val: item.quantity, label: item.unit, color: stockColor(item), big: true },
                  { val: formatZAR(item.cost_price), label: "cost" },
                  { val: formatZAR(item.selling_price), label: "sell" },
                  { val: formatZAR(item.quantity * item.cost_price), label: "value" },
                ].map((st, i) => (
                  <div key={i} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 2 }}>
                    <span style={{ fontSize: st.big ? 20 : 12, fontWeight: st.big ? 700 : 600, color: st.color || "#d0cdc6" }}>{st.val}</span>
                    <span style={{ fontSize: 8, color: "#444", letterSpacing: 1.5, textTransform: "uppercase" }}>{st.label}</span>
                  </div>
                ))}
              </div>
              <div style={{ display: "flex", gap: 8 }}>
                <button onClick={() => openAdjust(item)} style={{ flex: 2, background: "rgba(201,169,110,0.08)", border: "1px solid rgba(201,169,110,0.2)", color: "#c9a96e", padding: "9px", fontSize: 11, cursor: "pointer", letterSpacing: 1, fontFamily: "'DM Mono', monospace" }}>⇅ Stock / Sale</button>
                <button onClick={() => openEdit(item)} style={{ flex: 1, background: "transparent", border: "1px solid rgba(255,255,255,0.08)", color: "#888", padding: "9px", fontSize: 11, cursor: "pointer", fontFamily: "'DM Mono', monospace" }}>✎ Edit</button>
                <button onClick={() => setConfirmDelete(item)} style={{ background: "transparent", border: "1px solid rgba(255,100,100,0.15)", color: "#ff6b6b", padding: "9px 13px", fontSize: 13, cursor: "pointer" }}>✕</button>
              </div>
            </div>
          ))}

          <button onClick={exportCSV} style={{ display: "block", width: "100%", background: "transparent", border: "1px solid rgba(255,255,255,0.06)", color: "#444", padding: "12px", fontSize: 10, cursor: "pointer", letterSpacing: 2, marginTop: 8, fontFamily: "'DM Mono', monospace", textTransform: "uppercase" }}>↓ Export to CSV</button>
        </div>
      )}

      {/* ── SALES TAB ── */}
      {!loading && tab === "sales" && (
        <div className="page" style={{ padding: "20px 16px 80px" }}>
          <div className="grid2" style={{ marginBottom: 20 }}>
            {[
              { label: "Today's Revenue", value: formatZAR(todayRevenue), accent: true },
              { label: "Total Revenue", value: formatZAR(totalRevenue) },
              { label: "Sales Today", value: todaySales.length },
              { label: "Total Transactions", value: salesLog.length },
            ].map(s => (
              <div key={s.label} style={{ background: "rgba(255,255,255,0.03)", border: `1px solid ${s.accent ? "rgba(201,169,110,0.3)" : "rgba(255,255,255,0.07)"}`, padding: "16px" }}>
                <div style={{ fontSize: 22, fontWeight: 700, fontFamily: "'Playfair Display', serif", color: s.accent ? "#c9a96e" : "#f0ede6" }}>{s.value}</div>
                <div style={{ fontSize: 9, color: "#555", letterSpacing: 2, textTransform: "uppercase", marginTop: 4 }}>{s.label}</div>
              </div>
            ))}
          </div>

          <div className="section-title">Recent Sales</div>
          {salesLog.length === 0 && <div style={{ color: "#333", fontSize: 12, textAlign: "center", padding: "40px 0" }}>No sales recorded yet.</div>}
          {salesLog.map(sale => (
            <div key={sale.id} style={{ display: "flex", alignItems: "center", padding: "12px 0", borderBottom: "1px solid rgba(255,255,255,0.05)" }}>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 13, color: "#f0ede6", fontWeight: 600 }}>{sale.item_name}</div>
                <div style={{ fontSize: 10, color: "#555", marginTop: 2 }}>
                  {sale.qty} {sale.unit} × {formatZAR(sale.price_per_unit)}
                  {sale.note ? ` · ${sale.note}` : ""}
                </div>
                <div style={{ fontSize: 10, color: "#444", marginTop: 1 }}>{new Date(sale.created_at).toLocaleString("en-ZA", { dateStyle: "medium", timeStyle: "short" })}</div>
              </div>
              <div style={{ fontSize: 15, fontWeight: 700, color: "#00e5a0" }}>{formatZAR(sale.total)}</div>
            </div>
          ))}
        </div>
      )}

      {/* ── STATS TAB ── */}
      {!loading && tab === "stats" && (
        <div className="page" style={{ padding: "20px 16px 80px" }}>
          <div className="grid2" style={{ marginBottom: 8 }}>
            {[
              { label: "Total SKUs", value: inventory.length },
              { label: "Stock Cost Value", value: formatZAR(totalCostValue) },
              { label: "Potential Revenue", value: formatZAR(totalSellValue) },
              { label: "Gross Profit Margin", value: totalSellValue > 0 ? `${Math.round((totalProfit / totalSellValue) * 100)}%` : "—" },
            ].map(stat => (
              <div key={stat.label} style={{ background: "rgba(255,255,255,0.03)", border: "1px solid rgba(255,255,255,0.07)", padding: "18px 14px", marginBottom: 12 }}>
                <div style={{ fontSize: 22, fontWeight: 700, fontFamily: "'Playfair Display', serif", color: "#f0ede6" }}>{stat.value}</div>
                <div style={{ fontSize: 9, color: "#555", letterSpacing: 2, textTransform: "uppercase", marginTop: 4 }}>{stat.label}</div>
              </div>
            ))}
          </div>

          <div className="section-title">By Category</div>
          {CATEGORIES.filter(c => c !== "All").map(cat => {
            const items = inventory.filter(i => i.category === cat);
            const val = items.reduce((s, i) => s + i.quantity * i.cost_price, 0);
            return (
              <div key={cat} style={{ display: "flex", alignItems: "center", padding: "12px 0", borderBottom: "1px solid rgba(255,255,255,0.05)" }}>
                <span className="badge" style={{ background: catColor(cat), marginRight: 12 }}>{cat}</span>
                <span style={{ color: "#aaa", fontSize: 12, flex: 1 }}>{items.length} SKU{items.length !== 1 ? "s" : ""}</span>
                <span style={{ fontWeight: 600, fontSize: 13 }}>{formatZAR(val)}</span>
              </div>
            );
          })}

          <div className="section-title" style={{ marginTop: 28 }}>Top Items by Value</div>
          {[...inventory].sort((a, b) => (b.quantity * b.cost_price) - (a.quantity * a.cost_price)).slice(0, 5).map(item => (
            <div key={item.id} style={{ display: "flex", alignItems: "center", padding: "10px 0", borderBottom: "1px solid rgba(255,255,255,0.04)" }}>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 13, color: "#f0ede6" }}>{item.name}</div>
                <div style={{ fontSize: 10, color: "#555" }}>{item.quantity} {item.unit}(s) in stock</div>
              </div>
              <span style={{ fontWeight: 600, fontSize: 13, color: "#c9a96e" }}>{formatZAR(item.quantity * item.cost_price)}</span>
            </div>
          ))}

          <button onClick={fetchInventory} style={{ display: "block", width: "100%", background: "transparent", border: "1px solid rgba(255,255,255,0.07)", color: "#555", padding: "12px", fontSize: 10, cursor: "pointer", letterSpacing: 2, marginTop: 24, fontFamily: "'DM Mono', monospace", textTransform: "uppercase" }}>↻ Refresh Data</button>
        </div>
      )}

      {/* ── ANALYTICS TAB ── */}
      {!loading && tab === "analytics" && (
        <AnalyticsTab salesLog={salesLog} inventory={inventory} />
      )}

      {/* ── ALERTS TAB ── */}
      {!loading && tab === "alerts" && (
        <div className="page" style={{ padding: "20px 16px 80px" }}>
          <div className="grid2" style={{ marginBottom: 24 }}>
            <div style={{ background: "rgba(255,70,70,0.07)", border: "1px solid rgba(255,70,70,0.2)", padding: "18px 14px" }}>
              <div style={{ fontSize: 28, fontWeight: 700, fontFamily: "'Playfair Display', serif", color: "#ff4d4d" }}>{outItems.length}</div>
              <div style={{ fontSize: 9, color: "#ff4d4d", letterSpacing: 2, textTransform: "uppercase", marginTop: 4 }}>Out of Stock</div>
            </div>
            <div style={{ background: "rgba(255,170,0,0.07)", border: "1px solid rgba(255,170,0,0.2)", padding: "18px 14px" }}>
              <div style={{ fontSize: 28, fontWeight: 700, fontFamily: "'Playfair Display', serif", color: "#ffaa00" }}>{lowItems.length}</div>
              <div style={{ fontSize: 9, color: "#ffaa00", letterSpacing: 2, textTransform: "uppercase", marginTop: 4 }}>Low Stock</div>
            </div>
          </div>

          {outItems.length > 0 && (
            <>
              <div className="section-title" style={{ color: "#ff4d4d" }}>🔴 Out of Stock</div>
              {outItems.map(item => (
                <div key={item.id} style={{ display: "flex", alignItems: "center", padding: "12px 0", borderBottom: "1px solid rgba(255,70,70,0.1)" }}>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: 13, color: "#f0ede6", fontWeight: 600 }}>{item.name}</div>
                    <div style={{ fontSize: 10, color: "#666" }}>{item.sku} · {item.category}</div>
                  </div>
                  <button onClick={() => openAdjust(item)} style={{ background: "rgba(201,169,110,0.1)", border: "1px solid rgba(201,169,110,0.2)", color: "#c9a96e", padding: "6px 12px", fontSize: 10, cursor: "pointer", letterSpacing: 1, fontFamily: "'DM Mono', monospace" }}>Restock</button>
                </div>
              ))}
            </>
          )}

          {lowItems.filter(i => i.quantity > 0).length > 0 && (
            <>
              <div className="section-title" style={{ color: "#ffaa00", marginTop: outItems.length > 0 ? 28 : 0 }}>🟡 Running Low</div>
              {lowItems.filter(i => i.quantity > 0).map(item => (
                <div key={item.id} style={{ display: "flex", alignItems: "center", padding: "12px 0", borderBottom: "1px solid rgba(255,170,0,0.1)" }}>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: 13, color: "#f0ede6", fontWeight: 600 }}>{item.name}</div>
                    <div style={{ fontSize: 10, color: "#666" }}>{item.sku} · {item.quantity} {item.unit}(s) left (alert at {item.low_stock})</div>
                  </div>
                  <button onClick={() => openAdjust(item)} style={{ background: "rgba(201,169,110,0.1)", border: "1px solid rgba(201,169,110,0.2)", color: "#c9a96e", padding: "6px 12px", fontSize: 10, cursor: "pointer", letterSpacing: 1, fontFamily: "'DM Mono', monospace" }}>Restock</button>
                </div>
              ))}
            </>
          )}

          {lowItems.length === 0 && outItems.length === 0 && (
            <div style={{ textAlign: "center", padding: "60px 0", color: "#333", fontSize: 12 }}>
              <div style={{ fontSize: 32, marginBottom: 12 }}>✓</div>
              All items are well stocked.
            </div>
          )}
        </div>
      )}

      {/* ── TAB BAR ── */}
      <div className="tab-bar">
        {tabs.map(t => (
          <button key={t.id} className={`tab-btn ${tab === t.id ? "active" : ""}`} onClick={() => setTab(t.id)}>
            <span className="tab-icon">{t.icon}</span>
            {t.label}
            {t.id === "alerts" && lowItems.length > 0 && (
              <span style={{ position: "absolute", top: 6, right: "calc(50% - 18px)", background: "#ff4d4d", color: "#fff", fontSize: 8, fontWeight: 700, width: 14, height: 14, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center" }}>{lowItems.length}</span>
            )}
          </button>
        ))}
      </div>

      {/* ── ADD / EDIT MODAL ── */}
      {modal && (modal.mode === "add" || modal.mode === "edit") && (
        <div className="overlay" onClick={closeModal}>
          <div className="sheet" onClick={e => e.stopPropagation()}>
            <div className="sheet-title">{modal.mode === "add" ? "New Item" : "Edit Item"}</div>
            {[["Item Name *", "name", "e.g. Amber Dusk EDP", "text"], ["SKU *", "sku", "e.g. AD-EDP-50", "text"]].map(([lbl, key, ph, type]) => (
              <div key={key}>
                <label className="label">{lbl}</label>
                <input type={type} value={form[key]} onChange={F(key)} placeholder={ph} className="input" />
              </div>
            ))}
            <label className="label">Category</label>
            <select value={form.category} onChange={F("category")} className="input select">
              {CATEGORIES.filter(c => c !== "All").map(c => <option key={c}>{c}</option>)}
            </select>
            <label className="label">Unit of Measure</label>
            <input value={form.unit} onChange={F("unit")} placeholder="bottle, g, ml, pack, unit…" className="input" />
            <div className="grid2">
              {[["Quantity *", "quantity", "0"], ["Low Stock Alert", "low_stock", "10"]].map(([lbl, key, ph]) => (
                <div key={key}>
                  <label className="label">{lbl}</label>
                  <input type="number" value={form[key]} onChange={F(key)} placeholder={ph} className="input" />
                </div>
              ))}
            </div>
            <div className="grid2">
              {[["Cost Price (R) *", "cost_price", "0.00"], ["Selling Price (R)", "selling_price", "Optional"]].map(([lbl, key, ph]) => (
                <div key={key}>
                  <label className="label">{lbl}</label>
                  <input type="number" value={form[key]} onChange={F(key)} placeholder={ph} className="input" />
                </div>
              ))}
            </div>
            <label className="label">Notes</label>
            <textarea value={form.notes} onChange={F("notes")} placeholder="Size, scent notes, origin, supplier…" className="input textarea" />
            <button onClick={saveItem} className="gold-btn" style={{ marginTop: 24 }}>Save Item</button>
            <button onClick={closeModal} className="ghost-btn">Cancel</button>
          </div>
        </div>
      )}

      {/* ── ADJUST / SALE MODAL ── */}
      {modal && modal.mode === "adjust" && (
        <div className="overlay" onClick={closeModal}>
          <div className="sheet" onClick={e => e.stopPropagation()}>
            <div className="sheet-title">Stock & Sales</div>
            <p style={{ color: "#aaa", fontSize: 13, marginBottom: 20 }}>
              {modal.item.name} · <strong style={{ color: "#f0ede6" }}>{modal.item.quantity} {modal.item.unit}(s)</strong> in stock
            </p>

            {/* Toggle */}
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 0, border: "1px solid rgba(255,255,255,0.1)", marginBottom: 20 }}>
              {[["remove", "💰 Record Sale"], ["add", "📦 Restock"]].map(([val, lbl]) => (
                <button key={val} onClick={() => setAdjustType(val)} style={{ padding: "12px", background: adjustType === val ? "#c9a96e" : "transparent", color: adjustType === val ? "#0a0a0a" : "#666", border: "none", fontSize: 12, fontWeight: adjustType === val ? 700 : 400, cursor: "pointer", fontFamily: "'DM Mono', monospace" }}>{lbl}</button>
              ))}
            </div>

            <label className="label">Quantity {adjustType === "remove" ? "Sold" : "Received"} *</label>
            <input type="number" min="1" value={adjustQty} onChange={e => setAdjustQty(e.target.value)} placeholder="e.g. 2" className="input" />

            {adjustType === "remove" && (
              <>
                <label className="label">Price Per Unit (R)</label>
                <input type="number" value={salePrice} onChange={e => setSalePrice(e.target.value)} placeholder={modal.item.selling_price ? `Default: R${modal.item.selling_price}` : "Enter price"} className="input" />
                <label className="label">Note (optional)</label>
                <input value={saleNote} onChange={e => setSaleNote(e.target.value)} placeholder="e.g. WhatsApp order, market stall…" className="input" />
                {adjustQty && salePrice && (
                  <div style={{ marginTop: 16, background: "rgba(0,229,160,0.07)", border: "1px solid rgba(0,229,160,0.15)", padding: "12px 14px", fontSize: 13 }}>
                    💰 Total Sale: <strong style={{ color: "#00e5a0" }}>{formatZAR(Number(adjustQty) * Number(salePrice))}</strong>
                  </div>
                )}
              </>
            )}

            <button onClick={applyAdjust} className="gold-btn" style={{ marginTop: 24, background: adjustType === "remove" ? "#00e5a0" : "#c9a96e" }}>
              {adjustType === "remove" ? "✓ Record Sale" : "✓ Add to Stock"}
            </button>
            <button onClick={closeModal} className="ghost-btn">Cancel</button>
          </div>
        </div>
      )}

      {/* ── CONFIRM DELETE ── */}
      {confirmDelete && (
        <div className="overlay" onClick={() => setConfirmDelete(null)}>
          <div className="sheet" onClick={e => e.stopPropagation()} style={{ padding: "28px 20px 40px" }}>
            <div className="sheet-title">Delete Item?</div>
            <p style={{ color: "#aaa", fontSize: 13, marginBottom: 24 }}>Are you sure you want to delete <strong style={{ color: "#f0ede6" }}>{confirmDelete.name}</strong>? This cannot be undone.</p>
            <button onClick={() => doDelete(confirmDelete.id)} style={{ display: "block", width: "100%", background: "#ff4d4d", color: "#fff", border: "none", padding: "14px", fontSize: 12, fontWeight: 700, cursor: "pointer", letterSpacing: 2, fontFamily: "'DM Mono', monospace", textTransform: "uppercase" }}>Yes, Delete</button>
            <button onClick={() => setConfirmDelete(null)} className="ghost-btn">Cancel</button>
          </div>
        </div>
      )}

      {/* ── TOAST ── */}
      {toast && (
        <div className="toast" style={{ background: toast.type === "error" ? "#ff4d4d" : toast.type === "warn" ? "#ffaa00" : "#00e5a0" }}>
          {toast.msg}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
