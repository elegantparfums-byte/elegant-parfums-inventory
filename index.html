<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Elegant Parfums" />
  <meta name="application-name" content="Elegant Parfums" />
  <meta name="description" content="Elegant Parfums fragrance and home care inventory management app." />
  <link rel="manifest" href="/manifest.json" />
  <title>Elegant Parfums · Inventory</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { background: #0a0a0a; color: #f0ede6; -webkit-font-smoothing: antialiased; font-family: 'DM Mono', monospace; overscroll-behavior: none; }
    input, select, button, textarea { font-family: inherit; -webkit-appearance: none; }
    * { scrollbar-width: none; }
    ::-webkit-scrollbar { display: none; }
    .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; max-width: 600px; margin: 0 auto; background: #0f0f0f; border-top: 1px solid rgba(255,255,255,0.08); display: flex; z-index: 50; padding-bottom: env(safe-area-inset-bottom); }
    .tab-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 10px 4px; background: transparent; border: none; color: #444; font-size: 9px; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; position: relative; }
    .tab-btn.active { color: #c9a96e; }
    .tab-icon { font-size: 18px; line-height: 1; }
    .card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07); padding: 16px; margin-bottom: 12px; }
    .gold-btn { background: #c9a96e; color: #0a0a0a; border: none; padding: 14px; font-size: 12px; font-weight: 700; cursor: pointer; letter-spacing: 2px; text-transform: uppercase; width: 100%; font-family: 'DM Mono', monospace; margin-top: 20px; display: block; }
    .ghost-btn { background: transparent; color: #555; border: 1px solid rgba(255,255,255,0.08); padding: 12px; font-size: 12px; cursor: pointer; width: 100%; margin-top: 10px; font-family: 'DM Mono', monospace; display: block; }
    .input { width: 100%; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); color: #f0ede6; padding: 12px 14px; font-size: 14px; outline: none; box-sizing: border-box; font-family: 'DM Mono', monospace; }
    select.input { background: #1a1a1a; }
    textarea.input { resize: none; height: 70px; }
    .label { display: block; font-size: 10px; color: #555; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 6px; margin-top: 16px; }
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.88); z-index: 100; display: flex; align-items: flex-end; }
    .sheet { background: #111; border-top: 1px solid rgba(255,255,255,0.1); padding: 28px 20px 50px; width: 100%; max-height: 92vh; overflow-y: auto; }
    .sheet-title { font-family: 'Playfair Display', Georgia, serif; font-size: 22px; color: #f0ede6; margin-bottom: 20px; letter-spacing: 2px; }
    .badge { display: inline-block; padding: 3px 10px; font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; color: #ccc; flex-shrink: 0; }
    .toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); z-index: 200; padding: 12px 24px; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; color: #0a0a0a; white-space: nowrap; font-family: 'DM Mono', monospace; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .section-hd { font-size: 10px; color: #555; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 14px; margin-top: 24px; }
    .page { padding: 16px 16px 90px; }
    .divider { border: none; border-top: 1px solid rgba(255,255,255,0.05); margin: 20px 0; }
    .badge-status { font-size: 9px; font-weight: 700; letter-spacing: 1.5px; border: 1px solid; padding: 2px 7px; }
  </style>

<body>

<script>

    navigator.serviceWorker.register('/sw.js').catch(function(){});

</script>
<script type="text/babel">

const { useState, useEffect, useCallback } = React;

// ── Config ──────────────────────────────────────────────
const SUPABASE_URL = "https://tpjjyzlnneznbvfoipxv.supabase.co";
const SUPABASE_KEY = "sb_publishable_qIXLyAgVqSJdlOh0fdvYmw_knHeNNQ5";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const PASSWORD = "Kat#EPI@30";
const AUTH_KEY = "ep_auth_v1";

// ── Helpers ──────────────────────────────────────────────
const CATS = ["All", "Perfume", "Home Care", "Raw Materials", "Packaging"];
const fmtR = (v) => v == null ? "—" : "R" + Number(v).toLocaleString("en-ZA", { minimumFractionDigits: 2 });
const fmtRs = (v) => v == null ? "—" : "R" + Number(v).toLocaleString("en-ZA", { minimumFractionDigits: 0 });
const catBg = (c) => ({ "Perfume": "rgba(180,120,255,0.18)", "Home Care": "rgba(0,229,160,0.15)", "Raw Materials": "rgba(255,180,50,0.15)", "Packaging": "rgba(100,180,255,0.15)" }[c] || "rgba(255,255,255,0.08)");
const stkCol = (item) => item.quantity === 0 ? "#ff4d4d" : item.quantity <= item.low_stock ? "#ffaa00" : "#00e5a0";
const stkLbl = (item) => item.quantity === 0 ? "OUT" : item.quantity <= item.low_stock ? "LOW" : "OK";
const EMPTY = { name: "", sku: "", category: "Perfume", unit: "unit", quantity: "", low_stock: "", cost_price: "", selling_price: "", notes: "" };

// ── Login ────────────────────────────────────────────────
function Login({ onLogin }) {
  const [pw, setPw] = useState("");
  const [show, setShow] = useState(false);
  const [err, setErr] = useState(false);

  const attempt = () => {
    if (pw === PASSWORD) { sessionStorage.setItem(AUTH_KEY, "1"); onLogin(); }
    else { setErr(true); setPw(""); setTimeout(() => setErr(false), 2000); }
  };

  return (
    <div style={{ minHeight: "100vh", background: "#0a0a0a", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: "40px 24px" }}>
      <div style={{ fontSize: 11, color: "#c9a96e", letterSpacing: 8, marginBottom: 8 }}>✦</div>
      <h1 style={{ fontFamily: "'Playfair Display', serif", fontSize: 26, letterSpacing: 4, color: "#f0ede6", marginBottom: 4, textAlign: "center" }}>ELEGANT PARFUMS</h1>
      <p style={{ color: "#444", fontSize: 10, letterSpacing: 3, textTransform: "uppercase", marginBottom: 48 }}>Private Inventory</p>
      <div style={{ width: "100%", maxWidth: 320 }}>
        <label className="label">Password</label>
        <div style={{ position: "relative" }}>
          <input
            type={show ? "text" : "password"}
            value={pw}
            onChange={e => setPw(e.target.value)}
            onKeyDown={e => e.key === "Enter" && attempt()}
            placeholder="Enter password"
            className="input"
            style={{ border: err ? "1px solid #ff4d4d" : undefined, letterSpacing: 3, paddingRight: 44 }}
          />
          <button onClick={() => setShow(s => !s)} style={{ position: "absolute", right: 12, top: "50%", transform: "translateY(-50%)", background: "transparent", border: "none", color: "#555", cursor: "pointer", fontSize: 16 }}>{show ? "🙈" : "👁"}</button>
        </div>
        {err && <p style={{ color: "#ff4d4d", fontSize: 11, marginTop: 8, letterSpacing: 1 }}>Incorrect password.</p>}
        <button onClick={attempt} className="gold-btn">Unlock</button>
      </div>
      <p style={{ color: "#1e1e1e", fontSize: 10, marginTop: 48 }}>Elegant Parfums · Private</p>
    </div>
  );
}

// ── Inventory Tab ────────────────────────────────────────
function InventoryTab({ inventory, onAdd, onEdit, onAdjust, onDelete, fetchInventory }) {
  const [filter, setFilter] = useState("All");
  const [search, setSearch] = useState("");
  const lowItems = inventory.filter(i => i.quantity <= i.low_stock);

  const displayed = inventory.filter(item => {
    const catMatch = filter === "All" || item.category === filter;
    const q = search.toLowerCase();
    return catMatch && (!q || item.name.toLowerCase().includes(q) || item.sku.toLowerCase().includes(q));
  });

  const exportCSV = () => {
    const rows = [["Name","SKU","Category","Unit","Qty","Low Stock","Cost (R)","Sell (R)","Stock Value (R)","Notes"]];
    inventory.forEach(i => rows.push([i.name, i.sku, i.category, i.unit, i.quantity, i.low_stock, i.cost_price, i.selling_price ?? "", (i.quantity * i.cost_price).toFixed(2), i.notes ?? ""]));
    const csv = rows.map(r => r.map(v => '"' + v + '"').join(",")).join("\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
    a.download = "ep-inventory-" + new Date().toISOString().slice(0,10) + ".csv";
    a.click();
  };

  return (
    <div className="page">
      <input value={search} onChange={e => setSearch(e.target.value)} placeholder="🔍  Search name or SKU…" className="input" style={{ marginBottom: 12 }} />
      <div style={{ display: "flex", gap: 8, overflowX: "auto", marginBottom: 14, paddingBottom: 2 }}>
        {CATS.map(c => (
          <button key={c} onClick={() => setFilter(c)} style={{ background: filter === c ? "rgba(201,169,110,0.1)" : "transparent", border: "1px solid " + (filter === c ? "#c9a96e" : "rgba(255,255,255,0.08)"), color: filter === c ? "#c9a96e" : "#555", padding: "6px 14px", fontSize: 10, letterSpacing: 1.5, textTransform: "uppercase", cursor: "pointer", whiteSpace: "nowrap", flexShrink: 0, fontFamily: "'DM Mono', monospace" }}>{c}</button>
        ))}
      </div>
      {lowItems.length > 0 && (
        <div style={{ background: "rgba(255,170,0,0.07)", border: "1px solid rgba(255,170,0,0.2)", color: "#ffaa00", fontSize: 11, padding: "10px 14px", marginBottom: 14 }}>
          ⚠ {lowItems.length} item{lowItems.length > 1 ? "s" : ""} low on stock
        </div>
      )}
      {displayed.length === 0 && <div style={{ textAlign: "center", color: "#333", padding: "60px 0", fontSize: 12 }}>No items found.</div>}
      {displayed.map(item => (
        <div key={item.id} className="card">
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 8 }}>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 15, fontWeight: 600, color: "#f0ede6", marginBottom: 2 }}>{item.name}</div>
              <div style={{ fontSize: 10, color: "#555", letterSpacing: 1 }}>{item.sku}</div>
            </div>
            <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", gap: 4 }}>
              <span className="badge" style={{ background: catBg(item.category) }}>{item.category}</span>
              <span className="badge-status" style={{ color: stkCol(item), borderColor: stkCol(item) }}>{stkLbl(item)}</span>
            </div>
          </div>
          {item.notes ? <div style={{ fontSize: 11, color: "#555", marginBottom: 10, lineHeight: 1.5 }}>{item.notes}</div> : null}
          <div style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", borderTop: "1px solid rgba(255,255,255,0.05)", borderBottom: "1px solid rgba(255,255,255,0.05)", padding: "10px 0", margin: "10px 0", gap: 4 }}>
            {[
              { val: item.quantity, label: item.unit, color: stkCol(item), big: true },
              { val: fmtR(item.cost_price), label: "cost" },
              { val: fmtR(item.selling_price), label: "sell" },
              { val: fmtR(item.quantity * item.cost_price), label: "value" },
            ].map((st, i) => (
              <div key={i} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 2 }}>
                <span style={{ fontSize: st.big ? 20 : 12, fontWeight: st.big ? 700 : 600, color: st.color || "#d0cdc6" }}>{st.val}</span>
                <span style={{ fontSize: 8, color: "#444", letterSpacing: 1.5, textTransform: "uppercase" }}>{st.label}</span>
              </div>
            ))}
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            <button onClick={() => onAdjust(item)} style={{ flex: 2, background: "rgba(201,169,110,0.08)", border: "1px solid rgba(201,169,110,0.2)", color: "#c9a96e", padding: "9px", fontSize: 11, cursor: "pointer", fontFamily: "'DM Mono', monospace" }}>⇅ Stock / Sale</button>
            <button onClick={() => onEdit(item)} style={{ flex: 1, background: "transparent", border: "1px solid rgba(255,255,255,0.08)", color: "#888", padding: "9px", fontSize: 11, cursor: "pointer", fontFamily: "'DM Mono', monospace" }}>✎ Edit</button>
            <button onClick={() => onDelete(item)} style={{ background: "transparent", border: "1px solid rgba(255,70,70,0.15)", color: "#ff6b6b", padding: "9px 13px", fontSize: 13, cursor: "pointer" }}>✕</button>
          </div>
        </div>
      ))}
      <button onClick={exportCSV} className="ghost-btn" style={{ marginTop: 8, fontSize: 10, letterSpacing: 2, textTransform: "uppercase" }}>↓ Export Inventory CSV</button>
    </div>
  );
}

// ── Sales Tab ────────────────────────────────────────────
function SalesTab({ salesLog }) {
  const todaySales = salesLog.filter(s => new Date(s.created_at).toDateString() === new Date().toDateString());
  const todayRev = todaySales.reduce((s, i) => s + (i.total || 0), 0);
  const totalRev = salesLog.reduce((s, i) => s + (i.total || 0), 0);

  return (
    <div className="page">
      <div className="grid2" style={{ marginBottom: 20 }}>
        {[
          { label: "Today's Revenue", value: fmtR(todayRev), accent: true },
          { label: "Total Revenue", value: fmtR(totalRev) },
          { label: "Sales Today", value: todaySales.length },
          { label: "All Transactions", value: salesLog.length },
        ].map(s => (
          <div key={s.label} style={{ background: "rgba(255,255,255,0.03)", border: "1px solid " + (s.accent ? "rgba(201,169,110,0.3)" : "rgba(255,255,255,0.07)"), padding: "16px" }}>
            <div style={{ fontSize: 20, fontWeight: 700, fontFamily: "'Playfair Display', serif", color: s.accent ? "#c9a96e" : "#f0ede6" }}>{s.value}</div>
            <div style={{ fontSize: 9, color: "#555", letterSpacing: 2, textTransform: "uppercase", marginTop: 4 }}>{s.label}</div>
          </div>
        ))}
      </div>
      <div className="section-hd">Recent Sales</div>
      {salesLog.length === 0 && <div style={{ color: "#333", fontSize: 12, textAlign: "center", padding: "40px 0" }}>No sales recorded yet.</div>}
      {salesLog.map(sale => (
        <div key={sale.id} style={{ display: "flex", alignItems: "center", padding: "12px 0", borderBottom: "1px solid rgba(255,255,255,0.05)" }}>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 13, color: "#f0ede6", fontWeight: 600 }}>{sale.item_name}</div>
            <div style={{ fontSize: 10, color: "#555", marginTop: 2 }}>{sale.qty} {sale.unit} × {fmtR(sale.price_per_unit)}{sale.note ? " · " + sale.note : ""}</div>
            <div style={{ fontSize: 10, color: "#333", marginTop: 1 }}>{new Date(sale.created_at).toLocaleString("en-ZA", { dateStyle: "medium", timeStyle: "short" })}</div>
          </div>
          <div style={{ fontSize: 15, fontWeight: 700, color: "#00e5a0" }}>{fmtR(sale.total)}</div>
        </div>
      ))}
    </div>
  );
}

// ── Analytics Tab ────────────────────────────────────────
function AnalyticsTab({ salesLog, inventory }) {
  const [period, setPeriod] = useState("weekly");
  const [showReset, setShowReset] = useState(false);
  const [resetting, setResetting] = useState(false);

  const now = new Date();

  const weeklyData = Array.from({ length: 8 }, (_, i) => {
    const end = new Date(now); end.setHours(0,0,0,0); end.setDate(end.getDate() - end.getDay() - i * 7);
    const start = new Date(end); start.setDate(start.getDate() - 7);
    const sales = salesLog.filter(s => { const d = new Date(s.created_at); return d >= start && d < end; });
    const revenue = sales.reduce((s, x) => s + (x.total || 0), 0);
    const cost = sales.reduce((s, x) => { const it = inventory.find(t => t.id === x.item_id); return s + (it ? it.cost_price * x.qty : 0); }, 0);
    return { label: (start.getDate()) + "/" + (start.getMonth()+1), revenue, cost, profit: revenue - cost, count: sales.length };
  }).reverse();

  const monthlyData = Array.from({ length: 6 }, (_, i) => {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const start = new Date(d.getFullYear(), d.getMonth(), 1);
    const end = new Date(d.getFullYear(), d.getMonth() + 1, 1);
    const sales = salesLog.filter(s => { const dt = new Date(s.created_at); return dt >= start && dt < end; });
    const revenue = sales.reduce((s, x) => s + (x.total || 0), 0);
    const cost = sales.reduce((s, x) => { const it = inventory.find(t => t.id === x.item_id); return s + (it ? it.cost_price * x.qty : 0); }, 0);
    return { label: d.toLocaleString("en-ZA", { month: "short" }), revenue, cost, profit: revenue - cost, count: sales.length };
  }).reverse();

  const data = period === "weekly" ? weeklyData : monthlyData;
  const current = data[data.length - 1] || {};
  const totalRev = data.reduce((s, d) => s + d.revenue, 0);
  const totalProfit = data.reduce((s, d) => s + d.profit, 0);
  const totalTx = data.reduce((s, d) => s + d.count, 0);
  const activePeriods = data.filter(d => d.revenue > 0).length || 1;
  const avgRev = totalRev / activePeriods;
  const maxVal = Math.max(...data.map(d => d.revenue), 1);

  // Linear projection
  const pts = data.map(d => d.revenue);
  const n = pts.length;
  const sx = n*(n-1)/2, sy = pts.reduce((a,b)=>a+b,0);
  const sxy = pts.reduce((s,y,i)=>s+i*y,0), sx2 = pts.reduce((s,_,i)=>s+i*i,0);
  const slope = (n*sxy - sx*sy) / (n*sx2 - sx*sx) || 0;
  const intercept = (sy - slope*sx) / n;
  const projected = Math.max(0, slope*n + intercept);
  const trending = slope >= 0;

  const topItems = Object.values(salesLog.reduce((acc, s) => {
    if (!acc[s.item_name]) acc[s.item_name] = { name: s.item_name, qty: 0, revenue: 0 };
    acc[s.item_name].qty += s.qty;
    acc[s.item_name].revenue += s.total || 0;
    return acc;
  }, {})).sort((a,b) => b.revenue - a.revenue).slice(0,5);

  const exportSalesCSV = () => {
    const rows = [["Date","Time","Item","Qty","Unit","Price/Unit (R)","Total (R)","Note"]];
    salesLog.forEach(s => {
      const d = new Date(s.created_at);
      rows.push([d.toLocaleDateString("en-ZA"), d.toLocaleTimeString("en-ZA",{hour:"2-digit",minute:"2-digit"}), s.item_name, s.qty, s.unit, Number(s.price_per_unit).toFixed(2), Number(s.total).toFixed(2), s.note || ""]);
    });
    rows.push([], ["TOTAL","","","","","", salesLog.reduce((s,x)=>s+(x.total||0),0).toFixed(2),""]);
    rows.push(["Generated", new Date().toLocaleString("en-ZA")]);
    const csv = rows.map(r => r.map(v => '"'+v+'"').join(",")).join("\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
    a.download = "ep-sales-" + new Date().toISOString().slice(0,10) + ".csv";
    a.click();
  };

  const exportSalesTxt = () => {
    const total = salesLog.reduce((s,x)=>s+(x.total||0),0);
    const lines = [
      "═══════════════════════════════",
      "   ELEGANT PARFUMS",
      "   Sales Report",
      "   " + new Date().toLocaleDateString("en-ZA"),
      "═══════════════════════════════",
      "",
      "Total Revenue:   " + fmtR(total),
      "Total Sales:     " + salesLog.length + " transactions",
      topItems[0] ? "Top Item:        " + topItems[0].name : "",
      "",
      "───────────────────────────────",
      "SALES DETAIL",
      "───────────────────────────────",
      ...salesLog.map(s => {
        const d = new Date(s.created_at);
        return d.toLocaleDateString("en-ZA") + "  " + s.item_name + "\n  " + s.qty + " × " + fmtR(s.price_per_unit) + " = " + fmtR(s.total) + (s.note ? "\n  Note: " + s.note : "");
      }),
      "",
      "═══════════════════════════════",
    ].join("\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([lines], { type: "text/plain" }));
    a.download = "ep-sales-" + new Date().toISOString().slice(0,10) + ".txt";
    a.click();
  };

  const doReset = async () => {
    setResetting(true);
    const ids = salesLog.map(s => s.id);
    if (ids.length > 0) {
      await sb.from("sales_log").delete().in("id", ids);
    }
    setResetting(false);
    setShowReset(false);
    window.location.reload();
  };

  return (
    <div className="page">
      {/* Period toggle */}
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", border: "1px solid rgba(255,255,255,0.1)", marginBottom: 20 }}>
        {[["weekly","Weekly"],["monthly","Monthly"]].map(([v,l]) => (
          <button key={v} onClick={() => setPeriod(v)} style={{ padding: "12px", background: period===v ? "#c9a96e" : "transparent", color: period===v ? "#0a0a0a" : "#666", border: "none", fontSize: 12, fontWeight: period===v ? 700 : 400, cursor: "pointer", fontFamily: "'DM Mono', monospace" }}>{l}</button>
        ))}
      </div>

      {/* Summary */}
      <div className="grid2" style={{ marginBottom: 16 }}>
        {[
          { label: "This " + (period==="weekly"?"Week":"Month"), value: fmtRs(current.revenue), sub: (current.count||0) + " sales" },
          { label: "Profit", value: fmtRs(current.profit), sub: current.revenue > 0 ? Math.round((current.profit/current.revenue)*100)+"% margin" : "—", green: (current.profit||0) > 0 },
          { label: (period==="weekly"?"8-Week":"6-Month") + " Revenue", value: fmtRs(totalRev), sub: totalTx + " total sales" },
          { label: "Next Period Projection", value: fmtRs(projected), sub: trending ? "📈 Growing" : "📉 Declining", green: trending },
        ].map(s => (
          <div key={s.label} style={{ background: "rgba(255,255,255,0.03)", border: "1px solid " + (s.green ? "rgba(0,229,160,0.2)" : "rgba(255,255,255,0.07)"), padding: "14px 12px", marginBottom: 0 }}>
            <div style={{ fontSize: 17, fontWeight: 700, fontFamily: "'Playfair Display', serif", color: s.green ? "#00e5a0" : "#f0ede6", marginBottom: 3 }}>{s.value}</div>
            <div style={{ fontSize: 9, color: "#555", letterSpacing: 2, textTransform: "uppercase" }}>{s.label}</div>
            {s.sub ? <div style={{ fontSize: 10, color: s.green ? "#00e5a0" : "#444", marginTop: 3 }}>{s.sub}</div> : null}
          </div>
        ))}
      </div>

      {/* Bar chart */}
      <div className="section-hd">Revenue Chart</div>
      <div style={{ background: "rgba(255,255,255,0.02)", border: "1px solid rgba(255,255,255,0.06)", padding: "16px 12px 8px", marginBottom: 20 }}>
        <div style={{ display: "flex", alignItems: "flex-end", gap: 3, height: 100, marginBottom: 8 }}>
          {data.map((d, i) => {
            const h = Math.max(3, (d.revenue / maxVal) * 100);
            const ph = d.revenue > 0 ? Math.max(0, (d.profit / d.revenue) * h) : 0;
            const isNow = i === data.length - 1;
            return (
              <div key={i} style={{ flex: 1, height: "100%", display: "flex", alignItems: "flex-end" }}>
                <div style={{ width: "100%", height: h + "%", background: isNow ? "#c9a96e" : "rgba(201,169,110,0.25)", position: "relative" }}>
                  <div style={{ position: "absolute", bottom: 0, width: "100%", height: ph + "%", background: isNow ? "rgba(0,229,160,0.6)" : "rgba(0,229,160,0.2)" }} />
                </div>
              </div>
            );
          })}
        </div>
        <div style={{ display: "flex", gap: 3 }}>
          {data.map((d, i) => <div key={i} style={{ flex: 1, textAlign: "center", fontSize: 7, color: i===data.length-1 ? "#c9a96e" : "#333" }}>{d.label}</div>)}
        </div>
        <div style={{ display: "flex", gap: 16, marginTop: 8, justifyContent: "center" }}>
          <span style={{ fontSize: 9, color: "#c9a96e" }}>▪ Revenue</span>
          <span style={{ fontSize: 9, color: "#00e5a0" }}>▪ Profit</span>
        </div>
      </div>

      {/* Period breakdown */}
      <div className="section-hd">Period Breakdown</div>
      {[...data].reverse().slice(0,5).map((d,i) => (
        <div key={i} style={{ display: "flex", alignItems: "center", padding: "10px 0", borderBottom: "1px solid rgba(255,255,255,0.04)" }}>
          <div style={{ width: 40, fontSize: 10, color: "#666" }}>{d.label}</div>
          <div style={{ flex: 1, margin: "0 12px" }}>
            <div style={{ height: 3, background: "rgba(255,255,255,0.05)", borderRadius: 2 }}>
              <div style={{ height: "100%", width: (d.revenue/maxVal*100) + "%", background: "#c9a96e", borderRadius: 2 }} />
            </div>
          </div>
          <div style={{ textAlign: "right", minWidth: 100 }}>
            <div style={{ fontSize: 12, fontWeight: 600, color: "#f0ede6" }}>{fmtRs(d.revenue)}</div>
            <div style={{ fontSize: 10, color: d.profit >= 0 ? "#00e5a0" : "#ff4d4d" }}>{fmtRs(d.profit)} profit</div>
          </div>
        </div>
      ))}

      {/* Top sellers */}
      {topItems.length > 0 && (
        <>
          <div className="section-hd" style={{ marginTop: 24 }}>Top Selling Items</div>
          {topItems.map((item, i) => (
            <div key={i} style={{ display: "flex", alignItems: "center", padding: "10px 0", borderBottom: "1px solid rgba(255,255,255,0.04)" }}>
              <div style={{ fontSize: 13, color: "#c9a96e", fontWeight: 700, width: 20 }}>{i+1}</div>
              <div style={{ flex: 1, marginLeft: 8 }}>
                <div style={{ fontSize: 13, color: "#f0ede6" }}>{item.name}</div>
                <div style={{ fontSize: 10, color: "#555" }}>{item.qty} units sold</div>
              </div>
              <div style={{ fontSize: 13, fontWeight: 600, color: "#00e5a0" }}>{fmtRs(item.revenue)}</div>
            </div>
          ))}
        </>
      )}

      {/* Projection box */}
      <div style={{ marginTop: 24, background: "rgba(201,169,110,0.05)", border: "1px solid rgba(201,169,110,0.12)", padding: "16px" }}>
        <div style={{ fontSize: 10, color: "#c9a96e", letterSpacing: 2, textTransform: "uppercase", marginBottom: 10 }}>📈 Projection Summary</div>
        <div style={{ fontSize: 12, color: "#aaa", lineHeight: 2 }}>
          Avg {period} revenue: <strong style={{ color: "#f0ede6" }}>{fmtRs(avgRev)}</strong><br/>
          Next projection: <strong style={{ color: "#c9a96e" }}>{fmtRs(projected)}</strong><br/>
          Trend: <strong style={{ color: trending ? "#00e5a0" : "#ff4d4d" }}>{trending ? "📈 Growing" : "📉 Declining"}</strong>
        </div>
      </div>

      {/* Download reports */}
      {salesLog.length > 0 && (
        <div style={{ marginTop: 24, background: "rgba(255,255,255,0.02)", border: "1px solid rgba(255,255,255,0.07)", padding: "18px 16px" }}>
          <div style={{ fontSize: 10, color: "#c9a96e", letterSpacing: 2, textTransform: "uppercase", marginBottom: 6 }}>Download Sales Report</div>
          <p style={{ fontSize: 11, color: "#555", marginBottom: 14, lineHeight: 1.6 }}>{salesLog.length} records available.</p>
          <div className="grid2">
            <button onClick={exportSalesCSV} style={{ background: "#c9a96e", color: "#0a0a0a", border: "none", padding: "12px", fontSize: 11, fontWeight: 700, cursor: "pointer", letterSpacing: 1, fontFamily: "'DM Mono', monospace", textTransform: "uppercase" }}>↓ CSV / Excel</button>
            <button onClick={exportSalesTxt} style={{ background: "transparent", border: "1px solid rgba(201,169,110,0.3)", color: "#c9a96e", padding: "12px", fontSize: 11, cursor: "pointer", letterSpacing: 1, fontFamily: "'DM Mono', monospace", textTransform: "uppercase" }}>↓ Text Report</button>
          </div>
        </div>
      )}

      {salesLog.length === 0 && (
        <div style={{ textAlign: "center", color: "#333", fontSize: 12, padding: "40px 0" }}>No sales data yet.</div>
      )}

      {/* Reset */}
      {salesLog.length > 0 && (
        <div style={{ marginTop: 24, borderTop: "1px solid rgba(255,70,70,0.1)", paddingTop: 20 }}>
          <div style={{ fontSize: 10, color: "#555", letterSpacing: 2, textTransform: "uppercase", marginBottom: 8 }}>Danger Zone</div>
          <p style={{ fontSize: 11, color: "#444", marginBottom: 14, lineHeight: 1.6 }}>Permanently deletes all {salesLog.length} sales records. Stock levels are not affected.</p>
          <button onClick={() => setShowReset(true)} style={{ background: "transparent", border: "1px solid rgba(255,70,70,0.3)", color: "#ff4d4d", padding: "10px 20px", fontSize: 11, cursor: "pointer", letterSpacing: 2, textTransform: "uppercase", fontFamily: "'DM Mono', monospace", width: "100%" }}>🗑 Reset All Sales</button>
        </div>
      )}

      {showReset && (
        <div className="overlay" onClick={() => setShowReset(false)}>
          <div className="sheet" onClick={e => e.stopPropagation()}>
            <div className="sheet-title" style={{ color: "#ff4d4d" }}>Reset Sales?</div>
            <p style={{ color: "#aaa", fontSize: 13, marginBottom: 8, lineHeight: 1.7 }}>This will permanently delete <strong style={{ color: "#f0ede6" }}>all {salesLog.length} sales records</strong>. This cannot be undone.</p>
            <button onClick={doReset} disabled={resetting} style={{ display: "block", width: "100%", background: "#ff4d4d", color: "#fff", border: "none", padding: "14px", fontSize: 12, fontWeight: 700, cursor: "pointer", letterSpacing: 2, fontFamily: "'DM Mono', monospace", textTransform: "uppercase", marginTop: 20, opacity: resetting ? 0.6 : 1 }}>{resetting ? "Deleting…" : "Yes, Reset Everything"}</button>
            <button onClick={() => setShowReset(false)} className="ghost-btn">Cancel</button>
          </div>
        </div>
      )}
    </div>
  );
}

// ── Alerts Tab ───────────────────────────────────────────
function AlertsTab({ inventory, onAdjust }) {
  const outItems = inventory.filter(i => i.quantity === 0);
  const lowItems = inventory.filter(i => i.quantity > 0 && i.quantity <= i.low_stock);

  return (
    <div className="page">
      <div className="grid2" style={{ marginBottom: 24 }}>
        <div style={{ background: "rgba(255,70,70,0.07)", border: "1px solid rgba(255,70,70,0.2)", padding: "18px 14px" }}>
          <div style={{ fontSize: 28, fontWeight: 700, fontFamily: "'Playfair Display', serif", color: "#ff4d4d" }}>{outItems.length}</div>
          <div style={{ fontSize: 9, color: "#ff4d4d", letterSpacing: 2, textTransform: "uppercase", marginTop: 4 }}>Out of Stock</div>
        </div>
        <div style={{ background: "rgba(255,170,0,0.07)", border: "1px solid rgba(255,170,0,0.2)", padding: "18px 14px" }}>
          <div style={{ fontSize: 28, fontWeight: 700, fontFamily: "'Playfair Display', serif", color: "#ffaa00" }}>{lowItems.length}</div>
          <div style={{ fontSize: 9, color: "#ffaa00", letterSpacing: 2, textTransform: "uppercase", marginTop: 4 }}>Running Low</div>
        </div>
      </div>

      {outItems.length > 0 && (
        <>
          <div className="section-hd" style={{ color: "#ff4d4d" }}>🔴 Out of Stock</div>
          {outItems.map(item => (
            <div key={item.id} style={{ display: "flex", alignItems: "center", padding: "12px 0", borderBottom: "1px solid rgba(255,70,70,0.08)" }}>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 13, color: "#f0ede6", fontWeight: 600 }}>{item.name}</div>
                <div style={{ fontSize: 10, color: "#666" }}>{item.sku} · {item.category}</div>
              </div>
              <button onClick={() => onAdjust(item)} style={{ background: "rgba(201,169,110,0.1)", border: "1px solid rgba(201,169,110,0.2)", color: "#c9a96e", padding: "6px 12px", fontSize: 10, cursor: "pointer", letterSpacing: 1, fontFamily: "'DM Mono', monospace" }}>Restock</button>
            </div>
          ))}
        </>
      )}

      {lowItems.length > 0 && (
        <>
          <div className="section-hd" style={{ color: "#ffaa00", marginTop: outItems.length > 0 ? 24 : 0 }}>🟡 Running Low</div>
          {lowItems.map(item => (
            <div key={item.id} style={{ display: "flex", alignItems: "center", padding: "12px 0", borderBottom: "1px solid rgba(255,170,0,0.08)" }}>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 13, color: "#f0ede6", fontWeight: 600 }}>{item.name}</div>
                <div style={{ fontSize: 10, color: "#666" }}>{item.sku} · {item.quantity} {item.unit}(s) left</div>
              </div>
              <button onClick={() => onAdjust(item)} style={{ background: "rgba(201,169,110,0.1)", border: "1px solid rgba(201,169,110,0.2)", color: "#c9a96e", padding: "6px 12px", fontSize: 10, cursor: "pointer", letterSpacing: 1, fontFamily: "'DM Mono', monospace" }}>Restock</button>
            </div>
          ))}
        </>
      )}

      {outItems.length === 0 && lowItems.length === 0 && (
        <div style={{ textAlign: "center", padding: "60px 0", color: "#333", fontSize: 12 }}>
          <div style={{ fontSize: 32, marginBottom: 12 }}>✓</div>
          All items well stocked.
        </div>
      )}
    </div>
  );
}

// ── Overview Tab ─────────────────────────────────────────
function OverviewTab({ inventory }) {
  const totalCost = inventory.reduce((s, i) => s + i.quantity * i.cost_price, 0);
  const totalSell = inventory.filter(i => i.selling_price).reduce((s, i) => s + i.quantity * i.selling_price, 0);
  const margin = totalSell > 0 ? Math.round(((totalSell - totalCost) / totalSell) * 100) : 0;

  return (
    <div className="page">
      <div className="grid2" style={{ marginBottom: 8 }}>
        {[
          { label: "Total SKUs", value: inventory.length },
          { label: "Stock Cost Value", value: fmtRs(totalCost) },
          { label: "Potential Revenue", value: fmtRs(totalSell) },
          { label: "Gross Margin", value: margin + "%" },
        ].map(s => (
          <div key={s.label} style={{ background: "rgba(255,255,255,0.03)", border: "1px solid rgba(255,255,255,0.07)", padding: "18px 14px", marginBottom: 12 }}>
            <div style={{ fontSize: 22, fontWeight: 700, fontFamily: "'Playfair Display', serif", color: "#f0ede6" }}>{s.value}</div>
            <div style={{ fontSize: 9, color: "#555", letterSpacing: 2, textTransform: "uppercase", marginTop: 4 }}>{s.label}</div>
          </div>
        ))}
      </div>
      <div className="section-hd">By Category</div>
      {CATS.filter(c => c !== "All").map(cat => {
        const items = inventory.filter(i => i.category === cat);
        const val = items.reduce((s, i) => s + i.quantity * i.cost_price, 0);
        return (
          <div key={cat} style={{ display: "flex", alignItems: "center", padding: "12px 0", borderBottom: "1px solid rgba(255,255,255,0.05)" }}>
            <span className="badge" style={{ background: catBg(cat), marginRight: 12 }}>{cat}</span>
            <span style={{ color: "#aaa", fontSize: 12, flex: 1 }}>{items.length} SKUs</span>
            <span style={{ fontWeight: 600, fontSize: 13 }}>{fmtRs(val)}</span>
          </div>
        );
      })}
      <div className="section-hd" style={{ marginTop: 24 }}>Top Items by Value</div>
      {[...inventory].sort((a,b) => (b.quantity*b.cost_price)-(a.quantity*a.cost_price)).slice(0,5).map(item => (
        <div key={item.id} style={{ display: "flex", alignItems: "center", padding: "10px 0", borderBottom: "1px solid rgba(255,255,255,0.04)" }}>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 13, color: "#f0ede6" }}>{item.name}</div>
            <div style={{ fontSize: 10, color: "#555" }}>{item.quantity} {item.unit}(s)</div>
          </div>
          <span style={{ fontWeight: 600, fontSize: 13, color: "#c9a96e" }}>{fmtRs(item.quantity * item.cost_price)}</span>
        </div>
      ))}
    </div>
  );
}

// ── Main App ─────────────────────────────────────────────
function App() {
  const [authed, setAuthed] = useState(() => sessionStorage.getItem(AUTH_KEY) === "1");
  const [tab, setTab] = useState("inventory");
  const [inventory, setInventory] = useState([]);
  const [salesLog, setSalesLog] = useState([]);
  const [loading, setLoading] = useState(true);
  const [modal, setModal] = useState(null);
  const [form, setForm] = useState(EMPTY);
  const [adjustQty, setAdjustQty] = useState("");
  const [adjustType, setAdjustType] = useState("remove");
  const [salePrice, setSalePrice] = useState("");
  const [saleNote, setSaleNote] = useState("");
  const [toast, setToast] = useState(null);
  const [deleteTarget, setDeleteTarget] = useState(null);

  const showToast = (msg, type) => { setToast({ msg, type: type || "success" }); setTimeout(() => setToast(null), 2800); };

  const fetchAll = useCallback(async () => {
    setLoading(true);
    const [inv, sales] = await Promise.all([
      sb.from("inventory").select("*").order("created_at", { ascending: true }),
      sb.from("sales_log").select("*").order("created_at", { ascending: false }).limit(200),
    ]);
    setInventory(inv.data || []);
    setSalesLog(sales.data || []);
    setLoading(false);
  }, []);

  useEffect(() => { if (authed) fetchAll(); }, [authed, fetchAll]);

  if (!authed) return <Login onLogin={() => setAuthed(true)} />;

  const openAdd = () => { setForm(EMPTY); setModal("form-add"); };
  const openEdit = (item) => { setForm({ ...item, cost_price: item.cost_price ?? "", selling_price: item.selling_price ?? "", low_stock: item.low_stock ?? "" }); setModal("form-edit"); };
  const openAdjust = (item) => { setAdjustQty(""); setAdjustType("remove"); setSalePrice(item.selling_price || ""); setSaleNote(""); setModal({ mode: "adjust", item }); };
  const closeModal = () => setModal(null);

  const F = (key) => (e) => setForm(p => ({ ...p, [key]: e.target.value }));

  const saveItem = async () => {
    if (!form.name.trim() || !form.sku.trim() || form.quantity === "" || form.cost_price === "") { showToast("Fill in all required fields.", "error"); return; }
    const payload = { name: form.name.trim(), sku: form.sku.trim().toUpperCase(), category: form.category, unit: form.unit, quantity: Number(form.quantity), low_stock: Number(form.low_stock) || 0, cost_price: Number(form.cost_price), selling_price: form.selling_price !== "" ? Number(form.selling_price) : null, notes: form.notes };
    if (modal === "form-add") {
      const { error } = await sb.from("inventory").insert(payload);
      if (error) { showToast("Error: " + error.message, "error"); return; }
      showToast('"' + payload.name + '" added. ✓');
    } else {
      const { error } = await sb.from("inventory").update(payload).eq("id", form.id);
      if (error) { showToast("Error: " + error.message, "error"); return; }
      showToast('"' + payload.name + '" updated. ✓');
    }
    await fetchAll();
    closeModal();
  };

  const applyAdjust = async () => {
    const delta = Number(adjustQty);
    if (!delta || isNaN(delta) || delta <= 0) { showToast("Enter a valid quantity.", "error"); return; }
    const item = modal.item;
    const newQty = adjustType === "add" ? item.quantity + delta : Math.max(0, item.quantity - delta);
    const { error } = await sb.from("inventory").update({ quantity: newQty }).eq("id", item.id);
    if (error) { showToast("Error: " + error.message, "error"); return; }
    if (adjustType === "remove") {
      const priceEach = Number(salePrice) || Number(item.selling_price) || 0;
      const { error: se } = await sb.from("sales_log").insert({ item_id: Number(item.id), item_name: item.name, qty: Number(delta), unit: item.unit, price_per_unit: Number(priceEach), total: Number(priceEach * delta), note: saleNote || "" });
      if (se) { showToast("Stock updated but sale log failed: " + se.message, "warn"); }
      else { showToast("Sale recorded: " + delta + " × " + item.name + " ✓"); }
    } else {
      showToast("Added " + delta + " " + item.unit + "(s) to stock. ✓");
    }
    await fetchAll();
    closeModal();
  };

  const doDelete = async () => {
    const { error } = await sb.from("inventory").delete().eq("id", deleteTarget.id);
    if (error) { showToast("Error: " + error.message, "error"); return; }
    showToast('"' + deleteTarget.name + '" removed.', "warn");
    setDeleteTarget(null);
    await fetchAll();
  };

  const tabs = [
    { id: "inventory", icon: "📦", label: "Stock" },
    { id: "sales", icon: "💰", label: "Sales" },
    { id: "analytics", icon: "📈", label: "Analytics" },
    { id: "overview", icon: "📊", label: "Overview" },
    { id: "alerts", icon: "🔔", label: "Alerts" },
  ];
  const lowCount = inventory.filter(i => i.quantity <= i.low_stock).length;

  return (
    <div style={{ minHeight: "100vh", background: "#0a0a0a", maxWidth: 600, margin: "0 auto" }}>

      {/* Header */}
      <header style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "44px 20px 16px", borderBottom: "1px solid rgba(255,255,255,0.07)", background: "#0a0a0a", position: "sticky", top: 0, zIndex: 40 }}>
        <div>
          <div style={{ fontSize: 10, color: "#c9a96e", letterSpacing: 6, marginBottom: 3 }}>✦</div>
          <h1 style={{ fontFamily: "'Playfair Display', serif", fontSize: 22, fontWeight: 700, letterSpacing: 3, color: "#f0ede6", margin: 0 }}>ELEGANT PARFUMS</h1>
        </div>
        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
          <button onClick={openAdd} style={{ background: "#c9a96e", color: "#0a0a0a", border: "none", padding: "9px 16px", fontSize: 11, fontWeight: 700, letterSpacing: 2, cursor: "pointer", textTransform: "uppercase", fontFamily: "'DM Mono', monospace" }}>+ Add</button>
          <button onClick={() => { sessionStorage.removeItem(AUTH_KEY); setAuthed(false); }} style={{ background: "transparent", border: "1px solid rgba(255,255,255,0.08)", color: "#555", padding: "9px 11px", fontSize: 14, cursor: "pointer" }} title="Lock">🔒</button>
        </div>
      </header>

      {loading && <div style={{ textAlign: "center", padding: "80px 20px", color: "#444", fontSize: 11, letterSpacing: 3 }}>☁ SYNCING…</div>}

      {!loading && tab === "inventory" && <InventoryTab inventory={inventory} onAdd={openAdd} onEdit={openEdit} onAdjust={openAdjust} onDelete={setDeleteTarget} fetchInventory={fetchAll} />}
      {!loading && tab === "sales" && <SalesTab salesLog={salesLog} />}
      {!loading && tab === "analytics" && <AnalyticsTab salesLog={salesLog} inventory={inventory} />}
      {!loading && tab === "overview" && <OverviewTab inventory={inventory} />}
      {!loading && tab === "alerts" && <AlertsTab inventory={inventory} onAdjust={openAdjust} />}

      {/* Tab Bar */}
      <div className="tab-bar">
        {tabs.map(t => (
          <button key={t.id} className={"tab-btn" + (tab===t.id?" active":"")} onClick={() => setTab(t.id)}>
            <span className="tab-icon">{t.icon}</span>
            {t.label}
            {t.id === "alerts" && lowCount > 0 && <span style={{ position: "absolute", top: 6, right: "calc(50% - 16px)", background: "#ff4d4d", color: "#fff", fontSize: 8, fontWeight: 700, width: 14, height: 14, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center" }}>{lowCount}</span>}
          </button>
        ))}
      </div>

      {/* Add / Edit Modal */}
      {(modal === "form-add" || modal === "form-edit") && (
        <div className="overlay" onClick={closeModal}>
          <div className="sheet" onClick={e => e.stopPropagation()}>
            <div className="sheet-title">{modal === "form-add" ? "New Item" : "Edit Item"}</div>
            {[["Item Name *","name","e.g. Amber Dusk EDP"],["SKU *","sku","e.g. AD-EDP-50"]].map(([l,k,p]) => (
              <div key={k}><label className="label">{l}</label><input value={form[k]} onChange={F(k)} placeholder={p} className="input" /></div>
            ))}
            <label className="label">Category</label>
            <select value={form.category} onChange={F("category")} className="input">
              {CATS.filter(c=>c!=="All").map(c=><option key={c}>{c}</option>)}
            </select>
            <label className="label">Unit</label>
            <input value={form.unit} onChange={F("unit")} placeholder="bottle, g, ml, pack…" className="input" />
            <div className="grid2">
              {[["Quantity *","quantity","0"],["Low Stock Alert","low_stock","10"]].map(([l,k,p]) => (
                <div key={k}><label className="label">{l}</label><input type="number" value={form[k]} onChange={F(k)} placeholder={p} className="input" /></div>
              ))}
            </div>
            <div className="grid2">
              {[["Cost Price (R) *","cost_price","0.00"],["Selling Price (R)","selling_price","Optional"]].map(([l,k,p]) => (
                <div key={k}><label className="label">{l}</label><input type="number" value={form[k]} onChange={F(k)} placeholder={p} className="input" /></div>
              ))}
            </div>
            <label className="label">Notes</label>
            <textarea value={form.notes} onChange={F("notes")} placeholder="Size, scent, origin, supplier…" className="input textarea" />
            <button onClick={saveItem} className="gold-btn">Save Item</button>
            <button onClick={closeModal} className="ghost-btn">Cancel</button>
          </div>
        </div>
      )}

      {/* Adjust / Sale Modal */}
      {modal && modal.mode === "adjust" && (
        <div className="overlay" onClick={closeModal}>
          <div className="sheet" onClick={e => e.stopPropagation()}>
            <div className="sheet-title">Stock & Sales</div>
            <p style={{ color: "#aaa", fontSize: 13, marginBottom: 20 }}>{modal.item.name} · <strong style={{ color: "#f0ede6" }}>{modal.item.quantity} {modal.item.unit}(s)</strong> in stock</p>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", border: "1px solid rgba(255,255,255,0.1)", marginBottom: 20 }}>
              {[["remove","💰 Record Sale"],["add","📦 Restock"]].map(([v,l]) => (
                <button key={v} onClick={() => setAdjustType(v)} style={{ padding: "12px", background: adjustType===v ? "#c9a96e" : "transparent", color: adjustType===v ? "#0a0a0a" : "#666", border: "none", fontSize: 12, fontWeight: adjustType===v ? 700 : 400, cursor: "pointer", fontFamily: "'DM Mono', monospace" }}>{l}</button>
              ))}
            </div>
            <label className="label">Quantity {adjustType==="remove"?"Sold":"Received"} *</label>
            <input type="number" min="1" value={adjustQty} onChange={e => setAdjustQty(e.target.value)} placeholder="e.g. 2" className="input" />
            {adjustType === "remove" && (
              <>
                <label className="label">Price Per Unit (R)</label>
                <input type="number" value={salePrice} onChange={e => setSalePrice(e.target.value)} placeholder={modal.item.selling_price ? "Default: R" + modal.item.selling_price : "Enter price"} className="input" />
                <label className="label">Note (optional)</label>
                <input value={saleNote} onChange={e => setSaleNote(e.target.value)} placeholder="e.g. WhatsApp order, market stall…" className="input" />
                {adjustQty && salePrice && (
                  <div style={{ marginTop: 14, background: "rgba(0,229,160,0.07)", border: "1px solid rgba(0,229,160,0.15)", padding: "12px 14px", fontSize: 13 }}>
                    Total Sale: <strong style={{ color: "#00e5a0" }}>{fmtR(Number(adjustQty) * Number(salePrice))}</strong>
                  </div>
                )}
              </>
            )}
            <button onClick={applyAdjust} className="gold-btn" style={{ background: adjustType==="remove" ? "#00e5a0" : "#c9a96e" }}>
              {adjustType === "remove" ? "✓ Record Sale" : "✓ Add to Stock"}
            </button>
            <button onClick={closeModal} className="ghost-btn">Cancel</button>
          </div>
        </div>
      )}

      {/* Delete Confirm */}
      {deleteTarget && (
        <div className="overlay" onClick={() => setDeleteTarget(null)}>
          <div className="sheet" onClick={e => e.stopPropagation()}>
            <div className="sheet-title">Delete Item?</div>
            <p style={{ color: "#aaa", fontSize: 13, marginBottom: 24, lineHeight: 1.7 }}>Delete <strong style={{ color: "#f0ede6" }}>{deleteTarget.name}</strong>? This cannot be undone.</p>
            <button onClick={doDelete} style={{ display: "block", width: "100%", background: "#ff4d4d", color: "#fff", border: "none", padding: "14px", fontSize: 12, fontWeight: 700, cursor: "pointer", letterSpacing: 2, fontFamily: "'DM Mono', monospace", textTransform: "uppercase", marginTop: 0 }}>Yes, Delete</button>
            <button onClick={() => setDeleteTarget(null)} className="ghost-btn">Cancel</button>
          </div>
        </div>
      )}

      {/* Toast */}
      {toast && (
        <div className="toast" style={{ background: toast.type==="error" ? "#ff4d4d" : toast.type==="warn" ? "#ffaa00" : "#00e5a0" }}>
          {toast.msg}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
